spring.application.name=usuario

# ============ Servidor ============
server.port=8080

# ============ Base de datos MySQL (contenedor docker mysql-plazoleta) ============
spring.datasource.url=jdbc:mysql://localhost:3306/plazoleta_usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ JPA / Hibernate ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# HU5: JWT — el secreto debe ser IDENTICO en usuario y restaurante
app.jwt.secret=plazoleta-secreto-super-compartido-entre-microservicios-2026
app.jwt.expiration-ms=28800000
