spring.application.name=usuario

# ============ Servidor ============
server.port=8080

# ============ Base de datos MySQL (contenedor docker mysql-plazoleta) ============
spring.datasource.url=jdbc:mysql://localhost:3306/plazoleta_usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ JPA / Hibernate ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true