spring.application.name=plazoleta-usuarios
server.port=8081

# Base de Datos H2 en memoria para desarrollo local rápido
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:usuariosdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}

# Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# Swagger / OpenAPI URL: http://localhost:8081/swagger-ui/index.html
springdoc.api-docs.path=/api-docs

# Local fallback only. Configure the same secret in all services outside development.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-this-before-deployment}
app.restaurantes.url=${RESTAURANTES_URL:http://localhost:8082}

# Enable only when provisioning the first administrator; all listed values are required.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.lastname=${BOOTSTRAP_ADMIN_LASTNAME:}
app.bootstrap-admin.document=${BOOTSTRAP_ADMIN_DOCUMENT:}
app.bootstrap-admin.phone=${BOOTSTRAP_ADMIN_PHONE:}
app.bootstrap-admin.birthdate=${BOOTSTRAP_ADMIN_BIRTHDATE:}