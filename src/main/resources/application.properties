spring.application.name=plazoleta-usuarios
server.port=8081

# Base de Datos H2 en memoria para desarrollo local rápido
spring.datasource.url=jdbc:h2:mem:usuariosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger / OpenAPI URL: http://localhost:8081/swagger-ui/index.html
springdoc.api-docs.path=/api-docs